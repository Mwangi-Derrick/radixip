# Redis Configuration for RadixIP pub/sub sync architecture

# Do not bind to 127.0.0.1 in docker so external containers can connect
bind 0.0.0.0
protected-mode no

# We only need Redis for passing pub/sub messages and caching the initial
# routing table (using HSET). We do NOT need aggressive persistence.
# RDB snapshots every 15 minutes if 1 key changed, mostly for crash recovery.
save 900 1

# Limit memory to 256MB. Routing tables rarely exceed a few MBs.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Optimize Pub/Sub buffers to prevent disconnects during massive route bursts (like full BGP table updates).
# Hard limit at 32MB, soft limit at 8MB for 60 seconds.
client-output-buffer-limit pubsub 32mb 8mb 60
