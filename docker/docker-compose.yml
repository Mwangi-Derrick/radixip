# docker/docker-compose.yml
# 🐳 Multi-service Docker setup

version: '3.8'

services:
  # Redis for L2 cache
  redis:
    image: redis:7.2-alpine
    container_name: radixip-redis
    ports:
      - "6379:6379"

  # Go gRPC Sidecar
  radixip-grpc-go:
    build:
      context: ..
      dockerfile: docker/Dockerfile.grpc-go
    container_name: radixip-grpc-go
    ports:
      - "50051:50051"
      - "9090:9090"
    environment:
      - GRPC_PORT=50051
      - METRICS_PORT=9090
      - RADIXIP_CONFIG=/etc/radixip/radixip.yaml

  # Rust gRPC Sidecar
  radixip-grpc-rust:
    build:
      context: ..
      dockerfile: docker/Dockerfile.grpc-rust
    container_name: radixip-grpc-rust
    ports:
      - "50052:50052"
      - "9091:9091"
    environment:
      - GRPC_PORT=50052
      - METRICS_PORT=9091
      - RADIXIP_CONFIG=/etc/radixip/radixip.yaml