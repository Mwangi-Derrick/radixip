{{- if .Values.sidecar.config.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "radixip.fullname" . }}-sidecar-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radixip.labels" . | nindent 4 }}
    app.kubernetes.io/component: sidecar-config
data:
  radixip.yaml: |-
{{- if .Values.sidecar.config.data }}
{{ .Values.sidecar.config.data | indent 4 }}
{{- else }}
    radixip:
      engine:
        variant: "concurrent"
        node_variant: "atomic"
        num_shards: 16
        cache:
          enabled: true
          max_entries: 10000
          ttl_seconds: 3600
      middleware:
        ip_source: "x-forwarded-for"
        trusted_proxies:
          - "127.0.0.1/32"
          - "::1/128"
        responses:
          blocked: 403
          rate_limited: 429
      blocklist:
        enabled: false
      xdp:
        enabled: {{ .Values.sidecar.xdp.enabled }}
        interface: {{ .Values.sidecar.xdp.interface | quote }}
        mode: {{ .Values.sidecar.xdp.mode | quote }}
        pin_dir: {{ .Values.sidecar.xdp.pinDir | quote }}
        fail_closed: {{ .Values.sidecar.xdp.failClosed }}
        min_v4_prefix: {{ .Values.sidecar.xdp.minV4Prefix }}
        min_v6_prefix: {{ .Values.sidecar.xdp.minV6Prefix }}
        never_block: {{ .Values.sidecar.xdp.neverBlock | toJson }}
        redis:
          url: {{ default (include "radixip.redisUrl" .) .Values.sidecar.xdp.redis.url | quote }}
          channel: {{ .Values.sidecar.xdp.redis.channel | quote }}
          snapshot_key: {{ .Values.sidecar.xdp.redis.snapshotKey | quote }}
      rate_limit:
        enabled: true
        algorithm: {{ .Values.defaultPolicy.algorithm | default "token_bucket" | quote }}
        capacity: {{ .Values.defaultPolicy.globalRule.capacity | default 100 }}
        refill_rate: {{ .Values.defaultPolicy.globalRule.refillRate | default 10 }}
        max_buckets: 1000000
        ttl_seconds: {{ .Values.defaultPolicy.ttlSecs | default 300 }}
      metrics:
        enabled: true
        endpoint: "/metrics"
{{- end }}
{{- end }}
