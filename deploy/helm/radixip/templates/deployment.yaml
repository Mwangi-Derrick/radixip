apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "radixip.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radixip.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "radixip.operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "radixip.operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "radixip.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --health-probe-bind-address=:{{ .Values.operator.healthProbe.port }}
            - --metrics-bind-address=:{{ .Values.operator.metrics.port }}
            - --lua-dir={{ .Values.operator.luaDir }}
          ports:
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.operator.healthProbe.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.luaScripts.enabled }}
          volumeMounts:
            - name: lua-scripts
              mountPath: {{ .Values.operator.luaDir }}
              readOnly: true
          {{- end }}
          {{- with .Values.operator.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.luaScripts.enabled }}
      volumes:
        - name: lua-scripts
          configMap:
            name: {{ include "radixip.fullname" . }}-lua-scripts
      {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
