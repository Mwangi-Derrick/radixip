{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "radixip.fullname" . }}-operator
  labels:
    {{- include "radixip.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - radixip.io
    resources:
      - ratelimiterpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - radixip.io
    resources:
      - ratelimiterpolicies/finalizers
    verbs:
      - update
  - apiGroups:
      - radixip.io
    resources:
      - ratelimiterpolicies/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "radixip.fullname" . }}-operator
  labels:
    {{- include "radixip.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "radixip.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "radixip.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "radixip.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radixip.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "radixip.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "radixip.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "radixip.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "radixip.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
