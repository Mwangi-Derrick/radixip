apiVersion: apps/v1
kind: Deployment
metadata:
  name: radixip-operator
  namespace: radixip-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: radixip-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: radixip-operator
      containers:
        - name: manager
          image: ghcr.io/mwangi-derrick/radixip-operator:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --lua-dir=/etc/radixip/lua
          volumeMounts:
            - name: lua-scripts
              mountPath: /etc/radixip/lua
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: lua-scripts
          configMap:
            name: radixip-lua-scripts
