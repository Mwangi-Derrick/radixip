apiVersion: v1
kind: ServiceAccount
metadata:
  name: radixip-operator
  namespace: radixip-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: radixip-operator-role
rules:
  - apiGroups:
      - radixip.io
    resources:
      - ratelimiterpolicies
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - radixip.io
    resources:
      - ratelimiterpolicies/finalizers
    verbs:
      - update
  - apiGroups:
      - radixip.io
    resources:
      - ratelimiterpolicies/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: radixip-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: radixip-operator-role
subjects:
  - kind: ServiceAccount
    name: radixip-operator
    namespace: radixip-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: radixip-leader-election-role
  namespace: radixip-system
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: radixip-leader-election-rolebinding
  namespace: radixip-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: radixip-leader-election-role
subjects:
  - kind: ServiceAccount
    name: radixip-operator
    namespace: radixip-system
