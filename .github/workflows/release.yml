name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'proto'
      - 'docker'
      - '.gitignore'
      - '.gitattributes'
      - 'scripts/**'
      - 'config'
      - 'metrics'
      - '.editorconfig'
      - 'Makefile'

permissions:
  contents: write

jobs:
  # ===========================================================================
  # 1. Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          name: "RadixIP ${{ github.ref_name }}"
          generate_release_notes: true

  # ===========================================================================
  # 2. Publish Rust crate to crates.io
  # ===========================================================================
  publish-rust:
    name: Publish Rust → crates.io
    runs-on: ubuntu-latest
    needs: create-release
    environment: publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish radixip_rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radixip_rs --no-verify
      - name: Build documentation
        run: cargo doc --no-deps -p radixip_rs
      - name: Upload docs to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  # ===========================================================================
  # 3. Build C/C++ shared libraries
  # ===========================================================================
  build-c-libs:
    name: Build C shared lib (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: libradixip.so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: libradixip-aarch64.so
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: libradixip.dylib
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: libradixip-arm64.dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: radixip.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (for aarch64 Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build -p radixip_rs --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.cross
        run: cross build -p radixip_rs --release --target ${{ matrix.target }}
      - name: Copy library
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          src=$(find "$TARGET_DIR" -maxdepth 1 -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | head -n1)
          if [ -z "$src" ]; then
            echo "ERROR: No library found in $TARGET_DIR"
            ls -la "$TARGET_DIR"
            exit 1
          fi
          cp -v "$src" "${{ matrix.artifact }}"
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
      - name: Upload header files
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lib/cpp/include/radixip.h
            lib/cpp/include/RadixEngine.hpp

  # ===========================================================================
  # 4. Build Node native addons - DEFINITIVE VERSION
  # ===========================================================================
  build-node:
    name: Build Node addon (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install cross (Linux only)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo install cross --git https://github.com/cross-rs/cross
      
      - name: Install napi-rs
        run: npm install -g @napi-rs/cli
      
      - name: Build Node addon
        working-directory: lib/node
        shell: bash
        run: |
          npm install
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
            napi build --platform --release --target ${{ matrix.target }}
          else
            napi build --platform --release --target ${{ matrix.target }}
          fi
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      
      - name: Upload .node file
        uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.target }}
          path: lib/node/*.node

  publish-node:
    name: Publish Node → npm
    runs-on: ubuntu-latest
    needs: build-node
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: node-addon-*
          merge-multiple: true
          path: lib/node/prebuilt
      - name: Publish to npm
        working-directory: lib/node
        run: npm publish --access public

  # ===========================================================================
  # 5. Build Python wheels - DEFINITIVE VERSION
  # ===========================================================================
  build-python-wheels:
    name: Build Python wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
            platform: linux
          - target: aarch64
            runner: ubuntu-latest
            platform: linux
          - target: x86_64
            runner: macos-13
            platform: macos
          - target: aarch64
            runner: macos-14
            platform: macos
          - target: x86_64
            runner: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maturin
        run: pip install maturin
      - name: Build wheels
        working-directory: lib/python
        run: maturin build --release --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: lib/python/dist/*.whl

  publish-python:
    name: Publish Python → PyPI
    runs-on: ubuntu-latest
    needs: build-python-wheels
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # ===========================================================================
  # 6. Verify Go module
  # ===========================================================================
  verify-go:
    name: Verify Go module
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build
        working-directory: lib/go/engine
        run: go build ./...
      - name: Test
        working-directory: lib/go/engine
        run: go test ./...