name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Trigger on any of the four release tag patterns, OR manually via the UI.
# Tags must be pushed with:  git tag rust-core-v1.2.0 && git push origin --tags
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'rust-core-v[0-9]*.[0-9]*.[0-9]*'
      - 'node-addon-v[0-9]*.[0-9]*.[0-9]*'
      - 'python-wheel-v[0-9]*.[0-9]*.[0-9]*'
      - 'c-lib-v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. rust-core-v1.2.3). Must already exist in the repo.'
        required: false
        default: ''

permissions:
  contents: write
  id-token: write   # needed by PyPI OIDC + npm provenance

# ─────────────────────────────────────────────────────────────────────────────
# Convenience: resolve the effective tag regardless of trigger type
# ─────────────────────────────────────────────────────────────────────────────
env:
  EFFECTIVE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ===========================================================================
  # 0. Push tag (workflow_dispatch only – ensures the tag exists on remote)
  # ===========================================================================
  push-tag:
    name: Ensure tag is on remote
    runs-on: ubuntu-latest
    # Only needed when triggered manually with an explicit tag input
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history so we can find the tag
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tag to remote (idempotent)
        run: |
          TAG="${{ github.event.inputs.tag }}"
          git fetch --tags --force
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally, pushing to remote..."
            git push origin "refs/tags/$TAG" || echo "Tag already on remote – OK"
          else
            echo "ERROR: tag $TAG does not exist in this repo. Create it first:"
            echo "  git tag $TAG && git push origin $TAG"
            exit 1
          fi

  # ===========================================================================
  # 1. Create GitHub Release (always runs, fully idempotent)
  # ===========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [push-tag]
    # Run whether push-tag was skipped (push trigger) or succeeded (manual trigger)
    if: always() && (needs.push-tag.result == 'success' || needs.push-tag.result == 'skipped')
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create (or update) GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        continue-on-error: true   # idempotent: a 422 "already exists" is fine
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          name: "RadixIP ${{ env.EFFECTIVE_TAG }}"
          generate_release_notes: true
          make_latest: true

  # ===========================================================================
  # 2. Publish Rust crate → crates.io
  # ===========================================================================
  publish-rust:
    name: Publish Rust → crates.io
    runs-on: ubuntu-latest
    needs: create-release
    if: |
      always() &&
      needs.create-release.result != 'cancelled' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rust-core-v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'rust-core-v'))
      )
    environment: publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check if radixip_rs is already published
        id: check_published
        run: |
          PACKAGE_NAME="radixip_rs"
          VERSION=$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name=="'"$PACKAGE_NAME"'") | .version')
          echo "Checking crates.io for $PACKAGE_NAME v$VERSION …"
          if cargo search "$PACKAGE_NAME" --limit 1 2>/dev/null \
              | grep -qF "$PACKAGE_NAME = \"$VERSION\""; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Already on crates.io – skipping publish."
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Not yet published."
          fi

      - name: Publish radixip_rs
        if: steps.check_published.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p radixip_rs --no-verify || true

      - name: Build documentation
        run: cargo doc --no-deps -p radixip_rs

      - name: Upload docs to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  # ===========================================================================
  # 3. Build C/C++ shared libraries
  # ===========================================================================
  build-c-libs:
    name: Build C shared lib (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    if: |
      always() &&
      needs.create-release.result != 'cancelled' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/c-lib-v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'c-lib-v'))
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: libradixip.so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: libradixip-aarch64.so
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            artifact: libradixip.dylib
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: libradixip-arm64.dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: radixip.dll
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for aarch64 Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build -p radixip_rs --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build -p radixip_rs --release --target ${{ matrix.target }}

      - name: Copy library artifact
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          src=$(find "$TARGET_DIR" -maxdepth 1 -type f \
            \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | head -n1)
          if [ -z "$src" ]; then
            echo "ERROR: No shared library found in $TARGET_DIR"
            ls -la "$TARGET_DIR" || true
            exit 1
          fi
          cp -v "$src" "${{ matrix.artifact }}"

      - name: Upload library to Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true   # idempotent re-upload
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          files: ${{ matrix.artifact }}

      - name: Upload header files (Linux x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ env.EFFECTIVE_TAG }}
          files: |
            lib/cpp/include/radixip.h
            lib/cpp/include/RadixEngine.hpp

  # ===========================================================================
  # 4. Build Node native addons
  # ===========================================================================
  build-node:
    name: Build Node addon (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    if: |
      always() &&
      needs.create-release.result != 'cancelled' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-addon-v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'node-addon-v'))
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install cross-compilation toolchain (Linux aarch64 only)
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install napi-rs CLI
        run: npm install -g @napi-rs/cli

      - name: Build Node addon
        working-directory: lib/node
        shell: bash
        run: |
          npm install
          napi build --platform --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.target }}
          path: lib/node/*.node

  publish-node:
    name: Publish Node → npm
    runs-on: ubuntu-latest
    needs: build-node
    if: |
      always() &&
      needs.build-node.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-addon-v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'node-addon-v'))
      )
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all .node artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: node-addon-*
          merge-multiple: true
          path: lib/node/prebuilt

      - name: Publish to npm
        working-directory: lib/node
        run: npm publish --access public --ignore-scripts || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ===========================================================================
  # 5. Build Python wheels
  # ===========================================================================
  build-python-wheels:
    name: Build Python wheel (${{ matrix.platform }}-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: create-release
    if: |
      always() &&
      needs.create-release.result != 'cancelled' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-wheel-v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'python-wheel-v'))
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            platform: linux
          - target: x86_64-apple-darwin
            runner: macos-latest
            platform: macos
          - target: aarch64-apple-darwin
            runner: macos-latest
            platform: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels via Maturin Action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist -i python3.12
          working-directory: lib/python

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.platform }}-${{ matrix.target }}
          path: lib/python/dist/*.whl

  publish-python:
    name: Publish Python → PyPI
    runs-on: ubuntu-latest
    needs: build-python-wheels
    if: |
      always() &&
      needs.build-python-wheels.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-wheel-v')) ||
        (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'python-wheel-v'))
      )
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # idempotent – never fail on duplicate version
