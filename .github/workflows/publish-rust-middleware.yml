name: Release Rust Middleware

on:
  push:
    tags:
      - 'rust-mw-v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  release-rust:
    name: Create GitHub Release for Rust Middleware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true   # idempotent - a 422 "already exists" is fine
        with:
          name: "RadixIP Rust Middleware ${{ github.ref_name }}"
          generate_release_notes: true
          make_latest: true

  publish-rust-middleware:
    name: Publish Rust Middleware to crates.io
    runs-on: ubuntu-latest
    needs: release-rust
    environment: publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------------------------
      # Pattern mirrors release.yml: check crates.io first via cargo search,
      # skip if already published, publish only if needed, then poll the REST API
      # until the version is confirmed live before moving to the next dependent.
      #
      # 400 errors (bad metadata, name taken, etc.) are NOT retried - they are
      # permanent failures that need a code fix, not a retry.
      # ---------------------------------------------------------------------------
      - name: Publish all crates in topological order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # --- helper: check_published <name> <version> -> exits 0 if already on crates.io ---
          check_published() {
            local crate="$1"
            local version="$2"
            if cargo search "${crate}" --limit 1 2>/dev/null \
                | grep -qF "${crate} = \"${version}\""; then
              return 0   # already published
            fi
            return 1     # not yet published
          }

          # --- helper: wait_for_index <name> <version> ---
          # Polls crates.io REST API until the version is visible (up to 6 min).
          wait_for_index() {
            local crate="$1"
            local version="$2"
            local api_url="https://crates.io/api/v1/crates/${crate}/${version}"
            local waited=0 max_wait=360 interval=10

            echo "Polling crates.io for ${crate} v${version}..."
            while true; do
              http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "User-Agent: radixip-ci (github.com/Mwangi-Derrick/radixip)" \
                "${api_url}")

              if [ "$http_code" = "200" ]; then
                echo "OK: ${crate} v${version} is live (${waited}s elapsed)."
                return 0
              fi

              if [ $waited -ge $max_wait ]; then
                echo "WARN: timed out after ${max_wait}s (HTTP ${http_code}). Proceeding anyway."
                return 0
              fi

              echo "  [${waited}s] not visible yet (HTTP ${http_code}), checking again in ${interval}s..."
              sleep $interval
              waited=$((waited + interval))
            done
          }

          # --- helper: publish_crate <name> <version> ---
          # Mirrors the check-then-publish pattern in release.yml:
          #   1. Skip if already published (cargo search check).
          #   2. Publish; treat 400 as a hard error (bad metadata - must fix), not a retry.
          #   3. Wait for the sparse index to reflect the new version before returning.
          publish_crate() {
            local crate="$1"
            local version="$2"

            echo ""
            echo "==== ${crate} v${version} ===="

            if check_published "${crate}" "${version}"; then
              echo "OK: ${crate} v${version} already on crates.io - skipping publish."
              # Still need to wait for the index so dependents can resolve it
              wait_for_index "${crate}" "${version}"
              return 0
            fi

            echo "Publishing ${crate} v${version}..."
            set +e
            output=$(cargo publish -p "${crate}" --no-verify 2>&1)
            rc=$?
            set -e
            echo "$output"

            if [ $rc -eq 0 ]; then
              echo "OK: published successfully."
            elif echo "$output" | grep -qiE "already uploaded|already exists"; then
              echo "OK: already on crates.io (race condition) - continuing."
            elif echo "$output" | grep -qiE "status 400|Bad Request"; then
              echo "ERROR: crates.io rejected with 400 Bad Request."
              echo "       This is a metadata problem in Cargo.toml, not a transient error."
              echo "       Fix the crate manifest and re-tag."
              exit 1
            else
              echo "WARN: publish returned non-zero ($rc). Checking if it landed anyway..."
              sleep 10
              if check_published "${crate}" "${version}"; then
                echo "OK: found on crates.io despite error - continuing."
              else
                echo "WARN: not found on crates.io. Downstream crates may fail."
              fi
            fi

            wait_for_index "${crate}" "${version}"
          }

          # Resolve all versions from workspace metadata
          meta=$(cargo metadata --format-version=1 --no-deps)
          ver() { echo "$meta" | jq -r ".packages[] | select(.name==\"$1\") | .version"; }

          V_CONFIG=$(ver "radixip-config")
          V_POLICY=$(ver "radixip-policy")
          V_TOWER=$(ver "radixip-tower")
          V_AXUM=$(ver "radixip-axum")
          V_ACTIX=$(ver "radixip-actix")
          V_GRPC=$(ver "radixip-grpc-interceptor")

          echo "Versions to publish:"
          echo "  radixip-config            $V_CONFIG"
          echo "  radixip-policy            $V_POLICY"
          echo "  radixip-tower             $V_TOWER"
          echo "  radixip-axum              $V_AXUM"
          echo "  radixip-actix             $V_ACTIX"
          echo "  radixip-grpc-interceptor  $V_GRPC"

          # Tier 0 - no internal deps
          publish_crate "radixip-config" "$V_CONFIG"

          # Tier 1 - depends on radixip-config
          publish_crate "radixip-policy" "$V_POLICY"

          # Tier 2 - depends on radixip-config + radixip-policy
          publish_crate "radixip-tower" "$V_TOWER"

          # Tier 3 - depend on tiers 0-2
          publish_crate "radixip-axum"             "$V_AXUM"
          publish_crate "radixip-actix"            "$V_ACTIX"
          publish_crate "radixip-grpc-interceptor" "$V_GRPC"

          echo ""
          echo "All crates published successfully."