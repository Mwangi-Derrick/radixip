name: Vegeta Load Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/bench.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/ffi-benchmarks.yml'
      - 'proto'
      - 'docker'
      - '.gitignore'
      - '.gitattributes'
      - 'config'
      - 'metrics'
      - '.editorconfig'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'proto'
      - 'docker'
      - '.gitignore'
      - '.gitattributes'
      - 'config'
      - 'metrics'
      - '.editorconfig'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: load-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  load-test:
    name: Load Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      
      - name: Make test script executable
        run: chmod +x scripts/vegeta_test.sh
      
      - name: Run load test (100 req/s)
        run: ./scripts/vegeta_test.sh 100 10s 100000
      
      - name: Run load test (500 req/s)
        run: ./scripts/vegeta_test.sh 500 10s 100000
      
      - name: Run load test (1000 req/s)
        run: ./scripts/vegeta_test.sh 1000 10s 100000

      - name: Run load test (2000 req/s)
        run: ./scripts/vegeta_test.sh 2000 10s 100000

      - name: Run attacker simulation test
        run: |
          chmod +x scripts/attacker_test.sh
          ./scripts/attacker_test.sh

      - name: Run blocklist simulation test
        run: |
          chmod +x scripts/blocklist_test.sh
          ./scripts/blocklist_test.sh
      


      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache test tool binaries (vegeta, ghz)
        uses: actions/cache@v4
        with:
          path: bin/
          key: ${{ runner.os }}-e2e-tools-vegeta12.11.1

      - name: Run E2E Orchestrator
        # The orchestrator self-downloads vegeta and ghz if not cached,
        # builds all kitchen sink binaries (Go + Rust), spawns all framework
        # servers, runs Phases 1-3, saves results and exits 1 on failures.
        run: go run ./cmd/e2e-orchestrator --results-dir ./test-results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            test-results/
