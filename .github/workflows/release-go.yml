name: Release Go Middleware

on:
  push:
    tags:
      - 'go-mw-v[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/bench.yml'
      - '.benchmarks.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/load-test.yml'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/ffi-benchmarks.yml'
      - '.github/workflows/publish-rust-middleware.yml'
      - '.github/workflows/benchmarks.yml'
      - 'proto'
      - 'docker'
      - '.gitignore'
      - '.gitattributes'
      - 'config'
      - 'metrics'
      - '.editorconfig'

permissions:
  contents: write

jobs:
  release-go:
    name: Create GitHub Release for Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "RadixIP Go Middleware ${{ github.ref_name }}"
          generate_release_notes: true

  # Go modules are automatically published to pkg.go.dev when a tag is pushed.
  # We just need to ensure the code compiles and tests pass.
  verify-go:
    name: Verify Go modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          
      - name: Verify Go Engine
        working-directory: lib/go/engine
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Verify Go Policy
        working-directory: lib/go/policy
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Verify Go Config
        working-directory: lib/go/config
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Verify Gin Adapter
        working-directory: lib/go/adapters/gin
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Verify Echo Adapter
        working-directory: lib/go/adapters/echo
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Verify Fiber Adapter
        working-directory: lib/go/adapters/fiber
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Verify Chi Adapter
        working-directory: lib/go/adapters/chi
        run: |
          go mod tidy
          go build ./...
          go test ./...

      - name: Verify Net/http Adapter
        working-directory: lib/go/adapters/nethttp
        run: |
          go mod tidy
          go build ./...
          go test ./...
