name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build and run benchmarks
        working-directory: ./lib/rust
        run: |
          # Build benchmarks
          cargo bench -p radixip_rs --no-run
          
          # Find and run the benchmark binary directly
          BENCH_BIN=$(find target/release -name "lookup_bench-*" -executable -type f | head -1)
          if [ -n "$BENCH_BIN" ]; then
            echo "Running benchmark binary: $BENCH_BIN"
            $BENCH_BIN --bench 2>&1 | tee ../../rust_bench_results.txt
          else
            echo "Falling back to cargo bench"
            cargo bench -p radixip_rs -- --verbose 2>&1 | tee ../../rust_bench_results.txt
          fi

      - name: Verify benchmark output
        run: |
          if [ ! -s rust_bench_results.txt ]; then
            echo "Error: Benchmark output file is empty"
            exit 1
          fi
          echo "File size: $(wc -c < rust_bench_results.txt) bytes"
          echo ""
          echo "=== Looking for benchmark data ==="
          if grep -q "Benchmarking" rust_bench_results.txt; then
            echo "✅ Found benchmark data"
            grep -A 5 "Benchmarking" rust_bench_results.txt | head -30
          else
            echo "⚠️  No benchmark data found, showing last 50 lines:"
            tail -50 rust_bench_results.txt
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run benchmarks
        working-directory: ./lib/go
        run: |
          go test -bench=. -benchmem -count=10 -v ./... 2>&1 | tee go_bench_results.txt

      - name: Verify Go benchmark output
        run: |
          if [ ! -s ./lib/go/go_bench_results.txt ]; then
            echo "Error: Go benchmark output file is empty"
            exit 1
          fi
          echo "File size: $(wc -c < ./lib/go/go_bench_results.txt) bytes"
          echo ""
          if grep -q "Benchmark" ./lib/go/go_bench_results.txt; then
            echo "✅ Found benchmark data"
            grep "Benchmark" ./lib/go/go_bench_results.txt | head -10
          else
            echo "⚠️  No benchmark data found"
            tail -50 ./lib/go/go_bench_results.txt
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: lib/go/go_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench