name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Gnuplot (for better benchmark output)
        run: sudo apt-get install -y gnuplot

      - name: Run benchmarks
        working-directory: ./lib/rust
        run: |
          # Run benchmarks with verbose output to ensure we capture results
          cargo bench -p radixip_rs -- --verbose --output-format=json 2>&1 | tee ../../rust_bench_results.txt
          
          # Also save the plain text output for backup
          cargo bench -p radixip_rs 2>&1 | tee ../../rust_bench_results_plain.txt

      - name: Check if benchmarks actually ran
        run: |
          echo "=== Checking benchmark output ==="
          echo "File size: $(wc -c < rust_bench_results.txt) bytes"
          echo ""
          echo "=== Looking for benchmark results ==="
          # Look for any benchmark results in the output
          if grep -q "Benchmarking" rust_bench_results.txt || \
             grep -q "time:" rust_bench_results.txt || \
             grep -q "thrpt:" rust_bench_results.txt || \
             grep -q "bench:" rust_bench_results.txt; then
            echo "✅ Found benchmark results!"
            echo ""
            echo "=== Sample benchmark results ==="
            grep -A 5 "Benchmarking" rust_bench_results.txt | head -30
          else
            echo "❌ No benchmark results found in stdout"
            echo ""
            echo "=== Full output ==="
            cat rust_bench_results.txt
            echo ""
            echo "=== Checking if benchmark binary exists ==="
            find ./lib/rust/target -name "lookup_bench-*" -executable -type f | head -5
            echo ""
            echo "=== Running benchmarks without JSON format ==="
            cd ./lib/rust
            cargo bench -p radixip_rs 2>&1 | tee ../../rust_bench_results_plain.txt
            cd ../..
            echo ""
            echo "=== Plain output (first 50 lines) ==="
            head -50 rust_bench_results_plain.txt
            exit 1
          fi

      - name: Extract benchmark data for the action
        run: |
          # The GitHub action expects JSON format from Criterion
          # If we have JSON data, use it; otherwise, create a summary
          if grep -q "{" rust_bench_results.txt; then
            echo "JSON benchmark data found"
            cp rust_bench_results.txt rust_bench_results_fixed.txt
          else
            echo "No JSON data found, creating summary from plain output"
            # Extract relevant benchmark data from plain output
            if [ -f rust_bench_results_plain.txt ]; then
              grep -E "(Benchmarking|time:|thrpt:)" rust_bench_results_plain.txt > rust_bench_results_fixed.txt
            else
              # If no benchmarks ran, create a placeholder
              echo "No benchmark data available" > rust_bench_results_fixed.txt
            fi
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results_fixed.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run benchmarks
        working-directory: ./lib/go
        run: |
          go test -bench=. -benchmem -count=10 -v ./... | tee ../go_bench_results.txt

      - name: Verify Go benchmark output
        run: |
          if [ ! -s lib/go/go_bench_results.txt ]; then
            echo "Error: Go benchmark output file is empty"
            exit 1
          fi
          
          echo "Go benchmark output file size: $(wc -c < lib/go/go_bench_results.txt) bytes"
          echo ""
          echo "First 20 lines of Go benchmark output:"
          head -n 20 lib/go/go_bench_results.txt
          
          # Check if there's actual benchmark data
          if grep -q "Benchmark" lib/go/go_bench_results.txt; then
            echo ""
            echo "✅ Benchmark data found in output"
          else
            echo ""
            echo "⚠️  Warning: No benchmark data found in output"
            exit 1
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: lib/go/go_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench