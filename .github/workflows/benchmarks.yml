name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run benchmarks
        working-directory: radixip_rs
        run: |
          cargo bench -- --output-format=json 2>&1 | tee ../rust_bench_results.txt

      - name: Verify benchmark output
        run: |
          if [ ! -s rust_bench_results.txt ]; then
            echo "Error: Benchmark output file is empty"
            exit 1
          fi
          echo "Benchmark output file size: $(wc -c < rust_bench_results.txt) bytes"
          echo "First 10 lines of benchmark output:"
          head -n 10 rust_bench_results.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run benchmarks
        working-directory: lib/go
        run: |
          go test -bench=. -benchmem -count=10 ./... | tee go_bench_results.txt

      - name: Verify Go benchmark output
        run: |
          if [ ! -s lib/go/go_bench_results.txt ]; then
            echo "Error: Go benchmark output file is empty"
            exit 1
          fi
          echo "Go benchmark output file size: $(wc -c < lib/go/go_bench_results.txt) bytes"
          echo "First 10 lines of Go benchmark output:"
          head -n 10 lib/go/go_bench_results.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: lib/go/go_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench