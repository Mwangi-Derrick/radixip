name: Benchmarks

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**' # Ignores an entire docs folder
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**' # Optional: Ignores an entire docs folder
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run benchmarks
        working-directory: ./lib/rust
        run: |
          cargo bench --bench lookup_bench -- --output-format bencher 2>&1 | tee ../../rust_bench_results.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run benchmarks
        working-directory: ./lib/go
        run: |
          go test -run=NONE -bench=. -benchmem -count=10 -v ./... 2>&1 | tee go_bench_results.txt

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: lib/go/go_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    needs: [bench-rust, bench-go]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-branch

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Deploy dashboard
        run: |
          if [ -f main-branch/docs/benchmarks/index.html ]; then
            cp main-branch/docs/benchmarks/index.html gh-pages-branch/index.html
            cd gh-pages-branch
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "update dashboard [skip ci]" || echo "No changes"
            git push origin gh-pages || echo "Nothing to push"
          else
            echo "⚠️  Dashboard not found, skipping"
          fi