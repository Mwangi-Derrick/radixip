name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run benchmarks
        working-directory: ./lib/rust
        run: |
          cargo bench --bench lookup_bench 2>&1 | tee ../../rust_bench_results.txt


      - name: Check if benchmarks ran
        run: |
          echo "=== Checking Rust benchmark output ==="
          if [ -s rust_bench_results.txt ]; then
            echo "✅ File exists with size: $(wc -c < rust_bench_results.txt) bytes"
            echo ""
            echo "=== Looking for benchmark data ==="
            if grep -q "time:" rust_bench_results.txt; then
              echo "✅ Found benchmark results!"
              grep -E "(time:|thrpt:)" rust_bench_results.txt | head -20
            else
              echo "⚠️  No benchmark results found. Showing last 50 lines:"
              tail -50 rust_bench_results.txt
            fi
          else
            echo "❌ No output file generated"
            exit 1
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run benchmarks only (skip tests)
        working-directory: ./lib/go
        run: |
          go test -run=NONE -bench=. -benchmem -count=10 ./... 2>&1 | tee go_bench_results.txt

      - name: Check Go benchmark output
        run: |
          echo "=== Checking Go benchmark output ==="
          if [ -s ./lib/go/go_bench_results.txt ]; then
            echo "✅ File exists with size: $(wc -c < ./lib/go/go_bench_results.txt) bytes"
            echo ""
            if grep -q "Benchmark" ./lib/go/go_bench_results.txt; then
              echo "✅ Found benchmark results!"
              grep "Benchmark" ./lib/go/go_bench_results.txt | head -20
            else
              echo "⚠️  No benchmark data found. Showing last 50 lines:"
              tail -50 ./lib/go/go_bench_results.txt
            fi
          else
            echo "❌ No output file generated"
            exit 1
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: lib/go/go_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  deploy-dashboard:
    name: Deploy Custom Dashboard
    runs-on: ubuntu-latest
    needs: [bench-rust, bench-go]
    steps:
      - name: Checkout main docs
        uses: actions/checkout@v4

      - name: Copy docs to temporary location
        run: |
          mkdir -p /tmp/docs
          cp docs/benchmarks/index.html /tmp/docs/index.html

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Copy dashboard to root of gh-pages
        run: |
          cp /tmp/docs/index.html ./index.html

      - name: Commit and Push to gh-pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "update dashboard homepage [skip ci]" || echo "No changes to commit"
          git push origin gh-pages || echo "Nothing to push"