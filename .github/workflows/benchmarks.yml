name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run benchmarks
        working-directory: ./lib/rust
        run: |
          cargo bench --bench lookup_bench > ../../rust_bench_results_full.txt 2>&1
          echo "=== Full benchmark output saved ==="
          ls -la ../../rust_bench_results_full.txt

      - name: Prepare final benchmark file
        run: |
          echo "=== Preparing final benchmark file ==="
          
          if [ -f rust_bench_results_full.txt ] && [ -s rust_bench_results_full.txt ]; then
            # Extract from first "Benchmarking" to end
            sed -n '/Benchmarking/,$p' rust_bench_results_full.txt > rust_bench_results_final.txt
            echo "✅ Extracted benchmark data"
          else
            echo "❌ No benchmark output found!"
            exit 1
          fi
          
          echo "File size: $(wc -c < rust_bench_results_final.txt) bytes"
          echo ""
          echo "=== First 10 lines ==="
          head -10 rust_bench_results_final.txt
          echo ""
          echo "=== Checking for Benchmarking ==="
          grep "Benchmarking" rust_bench_results_final.txt | head -3

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results_final.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run benchmarks
        working-directory: ./lib/go
        run: |
          go test -run=NONE -bench=. -benchmem -count=10 -v ./... 2>&1 | tee go_bench_results.txt
          echo "=== Go benchmark output saved ==="
          ls -la go_bench_results.txt

      - name: Prepare Go benchmark file
        run: |
          echo "=== Preparing Go benchmark file ==="
          
          if [ -f ./lib/go/go_bench_results.txt ] && [ -s ./lib/go/go_bench_results.txt ]; then
            cp ./lib/go/go_bench_results.txt go_bench_results_final.txt
            echo "✅ Go benchmark data prepared"
          else
            echo "❌ No Go benchmark output found!"
            exit 1
          fi
          
          echo "File size: $(wc -c < go_bench_results_final.txt) bytes"
          echo ""
          echo "=== First 10 lines ==="
          head -10 go_bench_results_final.txt
          echo ""
          echo "=== Checking for Benchmark ==="
          grep "Benchmark" go_bench_results_final.txt | head -3

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: go_bench_results_final.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    needs: [bench-rust, bench-go]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-branch

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Deploy dashboard
        run: |
          if [ -f main-branch/docs/benchmarks/index.html ]; then
            cp main-branch/docs/benchmarks/index.html gh-pages-branch/index.html
            cd gh-pages-branch
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "update dashboard [skip ci]" || echo "No changes"
            git push origin gh-pages || echo "Nothing to push"
            echo "✅ Dashboard deployed"
          else
            echo "⚠️  Dashboard not found, skipping"
          fi