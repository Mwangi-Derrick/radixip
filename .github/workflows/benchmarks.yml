name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run benchmarks
        working-directory: ./lib/rust
        run: |
          # Run benchmarks and save full output
          cargo bench --bench lookup_bench > ../../rust_bench_results_full.txt 2>&1
          
          # Extract only benchmark results (time: and thrpt: lines with context)
          grep -E "(time:|thrpt:|Benchmarking)" ../../rust_bench_results_full.txt > ../../rust_bench_results.txt || true
          
          # Also extract lines with benchmark names and their results
          grep -B 1 -A 3 "time:" ../../rust_bench_results_full.txt >> ../../rust_bench_results_filtered.txt || true
          
          echo "=== Files created ==="
          ls -la ../../rust_bench_results*.txt

      - name: BRUTAL FILE SEARCH - Find where the benchmark output is
        run: |
          echo "=== BRUTAL FILE SEARCH ==="
          echo "Searching entire filesystem for benchmark output files..."
          echo ""
          
          # Search for any files containing benchmark data
          echo "=== Files containing 'time:' ==="
          grep -r "time:" --include="*.txt" . 2>/dev/null | head -20 || echo "No files with 'time:' found"
          echo ""
          
          echo "=== Files containing 'thrpt:' ==="
          grep -r "thrpt:" --include="*.txt" . 2>/dev/null | head -20 || echo "No files with 'thrpt:' found"
          echo ""
          
          echo "=== All .txt files in the repository ==="
          find . -name "*.txt" -type f 2>/dev/null | grep -v target
          echo ""
          
          echo "=== Files in current directory ==="
          ls -la *.txt 2>/dev/null || echo "No .txt files in root"
          echo ""
          
          echo "=== Files in ./lib/rust ==="
          ls -la ./lib/rust/*.txt 2>/dev/null || echo "No .txt files in ./lib/rust"
          echo ""
          
          echo "=== Files in ./lib/go ==="
          ls -la ./lib/go/*.txt 2>/dev/null || echo "No .txt files in ./lib/go"
          echo ""
          
          echo "=== Criterion output directory ==="
          ls -la ./lib/rust/target/criterion/ 2>/dev/null || echo "No criterion output"
          echo ""
          
          # Check if any file has the benchmark data we need
          echo "=== Checking for benchmark data in any file ==="
          for file in $(find . -name "*.txt" -type f 2>/dev/null | grep -v target); do
            if grep -q "time:" "$file" 2>/dev/null; then
              echo "✅ Found benchmark data in: $file"
              echo "   File size: $(wc -c < "$file") bytes"
              echo "   First 5 lines with time:"
              grep "time:" "$file" | head -5
              echo ""
            fi
          done

      - name: Prepare final benchmark file
        run: |
          echo "=== Preparing final benchmark file ==="
          
          # ALWAYS use the FULL raw output - it has the Benchmarking lines
          if [ -f rust_bench_results_full.txt ] && [ -s rust_bench_results_full.txt ]; then
            echo "Using FULL raw benchmark output (contains Benchmarking lines)"
            cp rust_bench_results_full.txt rust_bench_results_final.txt
          else
            echo "❌ No benchmark output found!"
            exit 1
          fi
          
          echo "Final file: rust_bench_results_final.txt"
          echo "File size: $(wc -c < rust_bench_results_final.txt) bytes"
          echo ""
          echo "=== First 30 lines of final file (checking for Benchmarking) ==="
          head -30 rust_bench_results_final.txt
          echo ""
          echo "=== Checking for 'Benchmarking' in final file ==="
          grep "Benchmarking" rust_bench_results_final.txt | head -5 || echo "❌ No 'Benchmarking' found!"

      - name: Check if benchmarks ran
        run: |
          echo "=== Checking Rust benchmark output ==="
          if [ -s rust_bench_results_final.txt ]; then
            echo "✅ File exists with size: $(wc -c < rust_bench_results_final.txt) bytes"
            echo ""
            echo "=== Looking for benchmark data ==="
            if grep -q "time:" rust_bench_results_final.txt; then
              echo "✅ Found benchmark results!"
              grep -E "(time:|thrpt:)" rust_bench_results_final.txt | head -20
            else
              echo "⚠️  No benchmark results found. Showing last 50 lines:"
              tail -50 rust_bench_results_final.txt
              exit 1
            fi
          else
            echo "❌ No output file generated"
            exit 1
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results_final.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run benchmarks only (skip tests)
        working-directory: ./lib/go
        run: |
          go test -run=NONE -bench=. -benchmem -count=10 -v ./... 2>&1 | tee go_bench_results.txt

      - name: BRUTAL FILE SEARCH - Find Go benchmark output
        run: |
          echo "=== BRUTAL FILE SEARCH FOR GO ==="
          echo "Searching for Go benchmark files..."
          echo ""
          
          echo "=== All .txt files in the repository ==="
          find . -name "*.txt" -type f 2>/dev/null | grep -v target
          echo ""
          
          echo "=== Files in ./lib/go ==="
          ls -la ./lib/go/*.txt 2>/dev/null || echo "No .txt files in ./lib/go"
          echo ""
          
          echo "=== Checking for Benchmark in any file ==="
          for file in $(find . -name "*.txt" -type f 2>/dev/null | grep -v target); do
            if grep -q "Benchmark" "$file" 2>/dev/null; then
              echo "✅ Found Go benchmark data in: $file"
              echo "   File size: $(wc -c < "$file") bytes"
              echo "   First 5 lines with Benchmark:"
              grep "Benchmark" "$file" | head -5
              echo ""
            fi
          done

      - name: Prepare Go benchmark file
        run: |
          echo "=== Preparing Go benchmark file ==="
          
          if [ -f ./lib/go/go_bench_results.txt ] && [ -s ./lib/go/go_bench_results.txt ]; then
            echo "Using Go benchmark results from ./lib/go/go_bench_results.txt"
            cp ./lib/go/go_bench_results.txt go_bench_results_final.txt
          elif [ -f go_bench_results.txt ] && [ -s go_bench_results.txt ]; then
            echo "Using Go benchmark results from go_bench_results.txt"
            cp go_bench_results.txt go_bench_results_final.txt
          else
            # Try to find any file with Benchmark data
            FOUND_FILE=$(find . -name "*.txt" -type f -exec grep -l "Benchmark" {} \; 2>/dev/null | head -1)
            if [ -n "$FOUND_FILE" ]; then
              echo "Found Go benchmark data in: $FOUND_FILE"
              cp "$FOUND_FILE" go_bench_results_final.txt
            else
              echo "No Go benchmark data found at all!"
              exit 1
            fi
          fi
          
          echo "Final Go file: go_bench_results_final.txt"
          echo "File size: $(wc -c < go_bench_results_final.txt) bytes"
          echo ""
          echo "=== First 20 lines of final Go file ==="
          head -20 go_bench_results_final.txt
          echo ""
          echo "=== Checking for Benchmark in final file ==="
          grep "Benchmark" go_bench_results_final.txt | head -5 || echo "No Benchmark found in final file"

      - name: Check Go benchmark output
        run: |
          echo "=== Checking Go benchmark output ==="
          if [ -s go_bench_results_final.txt ]; then
            echo "✅ File exists with size: $(wc -c < go_bench_results_final.txt) bytes"
            echo ""
            if grep -q "Benchmark" go_bench_results_final.txt; then
              echo "✅ Found benchmark results!"
              grep "Benchmark" go_bench_results_final.txt | head -20
            else
              echo "⚠️  No benchmark data found. Showing last 50 lines:"
              tail -50 go_bench_results_final.txt
              exit 1
            fi
          else
            echo "❌ No output file generated"
            exit 1
          fi

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: go_bench_results_final.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  deploy-dashboard:
    name: Deploy Custom Dashboard
    runs-on: ubuntu-latest
    needs: [bench-rust, bench-go]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main docs
        uses: actions/checkout@v4
        with:
          path: main-branch

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Copy dashboard to root
        run: |
          if [ -f main-branch/docs/benchmarks/index.html ]; then
            cp main-branch/docs/benchmarks/index.html gh-pages-branch/index.html
            cd gh-pages-branch
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "update dashboard homepage [skip ci]" || echo "No changes to commit"
            git push origin gh-pages || echo "Nothing to push"
          else
            echo "⚠️  docs/benchmarks/index.html not found, skipping dashboard deployment"
          fi