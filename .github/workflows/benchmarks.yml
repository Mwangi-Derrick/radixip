name: Benchmarks

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**' # Ignores an entire docs folder
      - '.github/worflows/bench.yml'
      - '.github/worflows/release.yml'
      - '.github/worflows/ffi-benchmarks.yml'
      - 'proto'
      - 'docker'
      - '.gitignore'
      - '.gitattributes'
      - 'scripts/**'
      - 'config'
      - 'metrics'
      - '.editorconfig'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**' # Ignores an entire docs folder
      - 'proto'
      - 'docker'
      - '.gitignore'
      - '.gitattributes'
      - 'scripts/**'
      - 'config'
      - 'metrics'
      - '.editorconfig'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  deployments: write

jobs:
  bench-rust:
    name: Rust (criterion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run benchmarks
        working-directory: ./lib/rust/engine
        timeout-minutes: 20
        run: |
          cargo bench --bench lookup_bench -- --output-format bencher 2>&1 | tee ../../../rust_bench_results.txt
          # Fail fast if the bench produced no usable output
          grep -q '^test ' ../../../rust_bench_results.txt || { echo "ERROR: bench output is empty or not in bencher format"; exit 1; }

      - name: Upload raw Rust benchmark log
        uses: actions/upload-artifact@v4
        with:
          name: rust-bench-log
          path: rust_bench_results.txt
          retention-days: 14

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Rust Benchmark
          tool: 'cargo'
          output-file-path: rust_bench_results.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '105%'
          fail-on-alert: false
          comment-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  bench-go:
    name: Go (testing.B) with SIMD CGO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build SIMD FFI shared library
        run: |
          cargo build -p node16_simd_ffi --release
          mkdir -p lib/vendor/lib
          cp -f target/release/libnode16_simd_ffi.so lib/vendor/lib/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: true

      - name: Run benchmarks with SIMD CGO
        working-directory: ./lib/go/engine
        timeout-minutes: 35  # Extra time for SIMD FFI overhead
        env:
          CGO_ENABLED: '1'
        run: |
          go test -run=NONE -bench=. -benchmem -count=10 -v -tags simd_cgo ./... 2>&1 | tee ../go_bench_results.txt

      - name: Upload raw Go benchmark log
        uses: actions/upload-artifact@v4
        with:
          name: go-bench-log
          path: lib/go/go_bench_results.txt
          retention-days: 14

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: lib/go/go_bench_results.txt
          comment-on-alert: false  # This stops the oversized PR comment
          comment-always: false
          auto-push: true          # This still saves results to gh-pages branch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '105%'
          fail-on-alert: false
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench

  deploy-dashboard:
    name: Deploy Dashboard
    runs-on: ubuntu-latest
    needs: [bench-rust, bench-go]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-branch

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Download raw benchmark logs
        uses: actions/download-artifact@v4
        with:
          path: raw-logs
          pattern: '*-bench-log'
          merge-multiple: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false

      - name: Build bench-parser
        working-directory: main-branch/cmd/bench-parser
        run: go build -o ../../../bin/bench-parser .

      - name: Generate benchmark dashboard site
        run: |
          if [ ! -f raw-logs/go_bench_results.txt ] && [ ! -f raw-logs/rust_bench_results.txt ]; then
            echo "⚠️  No benchmark logs available from this run, skipping dashboard regeneration"
            exit 0
          fi
          ./bin/bench-parser \
            -go-log raw-logs/go_bench_results.txt \
            -rust-log raw-logs/rust_bench_results.txt \
            -out main-branch/docs/benchmarks

      - name: Deploy dashboard
        run: |
          if [ -d main-branch/docs/benchmarks ]; then
            # Copy the generated multi-page site into the gh-pages branch root,
            # without touching dev/bench (owned by github-action-benchmark).
            cp -r main-branch/docs/benchmarks/. gh-pages-branch/
            cd gh-pages-branch
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html go rust compare data 2>/dev/null || true
            git commit -m "update benchmark dashboard [skip ci]" || echo "No changes"
            git push origin gh-pages || echo "Nothing to push"
          else
            echo "⚠️  Dashboard not generated, skipping"
          fi

      # - name: Commit regenerated dashboard back to main
      #   run: |
      #     if [ -d main-branch/docs/benchmarks ]; then
      #       cd main-branch
      #       git config user.name "github-actions[bot]"
      #       git config user.email "github-actions[bot]@users.noreply.github.com"
      #       git add docs/benchmarks
      #       git commit -m "chore: refresh benchmark dashboard [skip ci]" || echo "No changes"
      #       git push origin main || echo "Nothing to push"
      #     fi

load-test:
  name: Load Test (Vegeta + Spoof Proxy)
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26.1'

    - name: Install Vegeta
      run: go install github.com/tsenart/vegeta@latest

    - name: Tidy all modules
      run: |
        # Tidy each module to download dependencies
        cd scripts/testapp && go mod tidy && cd ../..
        cd scripts/spoof_proxy && go mod tidy && cd ../..
        cd scripts/seed_blocklist && go mod tidy && cd ../..
        
        # Also tidy lib/go submodules if they exist
        if [ -d lib/go/engine ]; then
          cd lib/go/engine && go mod tidy && cd ../../..
        fi
        if [ -d lib/go/policy ]; then
          cd lib/go/policy && go mod tidy && cd ../../..
        fi
        if [ -d lib/go/adapters/gin ]; then
          cd lib/go/adapters/gin && go mod tidy && cd ../../../..
        fi

    - name: Build all components
      run: |
        # Build each component from its directory
        cd scripts/testapp && go build -o ../../bin/testapp && cd ../..
        cd scripts/spoof_proxy && go build -o ../../bin/spoof_proxy && cd ../..
        cd scripts/seed_blocklist && go build -o ../../bin/seed_blocklist && cd ../..

    - name: Debug - Check binaries
      run: |
        echo "=== Built binaries ==="
        ls -la bin/

    - name: Start services
      run: |
        echo "Starting testapp..."
        ./bin/testapp &
        sleep 3
        
        echo "Starting spoof_proxy..."
        ./bin/spoof_proxy &
        sleep 3
        
        # Verify services are running
        echo "Checking services..."
        curl -s http://localhost:8080/ping || echo "⚠️  testapp not responding"
        curl -s http://localhost:8082/health || echo "⚠️  proxy not responding"

    - name: Seed blocklist (100k CIDRs)
      run: |
        echo "Seeding blocklist with 100k CIDRs..."
        ./bin/seed_blocklist -count 100000 -addr localhost:8082
        echo "✅ Blocklist seeded"

    - name: Run load test
      run: |
        echo "Running load test (50k req/s for 30s)..."
        echo "GET http://localhost:8080/ping" | \
          vegeta attack -rate=50000 -duration=30s -timeout=5s | \
          vegeta report -type=text | tee load_test_results.txt
        
        echo ""
        echo "=== Load Test Results ==="
        cat load_test_results.txt

    - name: Check p99 latency threshold
      run: |
        P99=$(grep "99th" load_test_results.txt | grep -oP '[\d.]+(ms|s)' | head -1)
        echo "📊 p99 latency: $P99"
        
        # Convert to milliseconds for comparison
        if [[ $P99 == *"s"* ]]; then
          VALUE=$(echo $P99 | sed 's/s//' | awk '{print $1 * 1000}')
        elif [[ $P99 == *"ms"* ]]; then
          VALUE=$(echo $P99 | sed 's/ms//')
        else
          echo "⚠️  Could not parse p99 value: $P99"
          exit 0
        fi
        
        # Fail if p99 > 100ms (adjust threshold as needed)
        if (( $(echo "$VALUE > 100" | bc -l 2>/dev/null || echo "0") )); then
          echo "❌ p99 latency ($VALUE ms) exceeds 100ms threshold"
          exit 1
        else
          echo "✅ p99 latency ($VALUE ms) within acceptable range"
        fi

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: load-test-results
        path: load_test_results.txt

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: debug-logs
        path: |
          *.log
          nohup.out
          bin/