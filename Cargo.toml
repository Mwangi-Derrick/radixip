[workspace]
resolver = "2"
members = [
    "lib/rust/engine",         # Core Rust implementation
    "lib/rust/config",
    "lib/rust/policy",
    "lib/rust/adapters/radixip-axum",
    "lib/rust/adapters/radixip-tower",
    "lib/rust/adapters/radixip-actix",
    "lib/python",              # PyO3 bindings
    "lib/node",                # N-API bindings
    "cmd/radixip-cli",         # CLI tool
    "lib/rust/node16_simd_ffi",# SIMD FFI bridge for Go CGo
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Derrick Mwangi <derrick@resplix.com>"]
license = "MIT"
repository = "https://github.com/Mwangi-Derrick/radixip"
homepage = "https://github.com/Mwangi-Derrick/radixip"
documentation = "https://github.com/Mwangi-Derrick/radixip/docs"
readme = "README.md"
keywords = ["radix", "ip", "subnet", "networking", "routing"]
categories = ["network-programming", "caching", "data-structures"]

[workspace.dependencies]
# Core
radixip_rs = { path = "lib/rust/engine" }

# For Python bindings
pyo3 = "0.22"
maturin = "0.18"

# For Node.js bindings
napi = { version = "2.12", features = ["serde-json"] }
napi-derive = "2.12"

# For benchmarks
criterion = "0.5"
dhat = "0.3"

# For serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For networking
ipnetwork = "0.20"

# For async
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
async-std = "1.13.2"

# For Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# For logging
tracing = "0.1"
tracing-subscriber = "0.3"

# For errors
thiserror = "1.0"
anyhow = "1.0"

# For atomics
arc-swap = "1.6"
dashmap = "5.5"
crossbeam = "0.8"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
lto = true
codegen-units = 1
debug = false
