# TOML reference only. Go, Rust, Node.js, and Python policy loaders currently
# load YAML; use config/radixip.yaml for a file that can be loaded directly.

[radixip.engine]
variant = "concurrent"
node_variant = "atomic"
num_shards = 16

[radixip.engine.cache]
enabled = true
max_entries = 10000
ttl_seconds = 3600

[radixip.middleware]
ip_source = "x-forwarded-for"
trusted_proxies = ["127.0.0.1/32", "::1/128"]

[radixip.middleware.responses]
blocked = 403
rate_limited = 429

[radixip.blocklist]
enabled = true

[[radixip.blocklist.sources]]
type = "file"
path = "/etc/radixip/blocklist.txt"

[radixip.rate_limit]
enabled = true
algorithm = "token_bucket"
capacity = 100
refill_rate = 10
window_seconds = 60
max_buckets = 1000000
ttl_seconds = 60

[radixip.rate_limit.bucket_mode]
mode = "ip"
depth_v4 = 24
depth_v6 = 48

[radixip.metrics]
enabled = true
prometheus_path = "/metrics"

[radixip.auto_ban]
enabled = true
threshold_violations = 5
window_seconds = 60
ban_duration_seconds = 3600

[radixip.rate_limit_routes]
enabled = true

[[radixip.rate_limit_routes.routes]]
path = "/api/v1/auth"
methods = ["POST", "PUT"]

[radixip.rate_limit_routes.routes.rate_limit]
enabled = true
algorithm = "token_bucket"
capacity = 5
refill_rate = 1
window_seconds = 60

[[radixip.rate_limit_routes.routes]]
path = "/api/v1/public"
methods = ["GET"]

[radixip.rate_limit_routes.routes.rate_limit]
enabled = true
algorithm = "token_bucket"
capacity = 1000
refill_rate = 100
window_seconds = 60
