[package]
name = "radixip-node"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
radixip_rs = { workspace = true }
