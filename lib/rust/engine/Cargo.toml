[package]
name = "radixip_rs"
version = "1.1.1"
edition = "2024"
documentation = "https://docs.rs/radixip_rs"
description = "High-performance IP subnet caching engine with Go & Rust implementations. Zero-allocation LPM lookups, Redis sync, and C-FFI bindings for database security, API gateways, and DDoS mitigation."
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["rlib"]  # rlib for Rust consumers; cdylib is in lib/node and lib/python
name = "radixip"

[features]
default = ["std", "redis"]
std = []
redis = ["dep:redis"]
ffi = []
pyo3 = ["dep:pyo3"]
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
# Core dependencies
ipnetwork = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
async-std = { workspace = true }

# Atomic pointer swap
arc-swap = { workspace = true }

# Optional: Redis
redis = { workspace = true, optional = true }

# Optional: Python bindings
pyo3 = { workspace = true, optional = true }

# Optional: Node.js bindings
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
dashmap = { workspace = true }
crossbeam = { workspace = true }
rand = "0.10.2"
sysinfo = "0.39.6"


# Optional: Benchmarks

[dev-dependencies]
criterion = { workspace = true }
tokio = { workspace = true }

[[bench]]
name = "lookup_bench"
path = "benches/lookup_bench.rs"
harness = false
