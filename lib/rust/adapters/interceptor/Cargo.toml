[package]
name = "radixip-grpc-interceptor"
version.workspace = true
edition.workspace = true
description = "Tonic gRPC interceptor and Tower layer for RadixIP IP protection"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
radixip_rs = { workspace = true }
radixip-policy = { path = "../../policy", version = "0.1.0" }
radixip-config = { path = "../../config", version = "0.1.0" }

# gRPC — match the grpc-server-rust version
tonic = "0.11"

# Tower + HTTP (tonic 0.11 uses http 0.2 + tower 0.4)
tower = { version = "0.4", features = ["util"] }
http = "0.2"
futures-util = { workspace = true }
