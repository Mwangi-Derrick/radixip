[package]
name        = "radixip-policy"
version     = "0.1.0"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true
homepage.workspace   = true
documentation.workspace = true
readme      = "README.md"
description = "Policy engine for RadixIP: IP blocklists, rate limiting, and auto-ban logic"
keywords    = ["radix", "ip", "policy", "rate-limiting", "security"]
categories  = ["network-programming", "caching"]

[dependencies]
radixip_rs    = { workspace = true }
radixip-config = { path = "../config", version = "0.1.0" }
serde         = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
tokio         = { workspace = true }
ipnetwork     = { workspace = true }
moka          = { workspace = true }
arc-swap      = { workspace = true }
dashmap       = { workspace = true }
notify        = { workspace = true }
redis         = { workspace = true, optional = true }

[features]
default = []
redis   = ["dep:redis"]
